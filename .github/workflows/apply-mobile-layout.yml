name: Add mobile Team Score column

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Team Score beside Team on mobile scoreboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let head='<div class=\"scoreTableWrap\"><table class=\"scoreTable\"><thead><tr><th>Rank</th><th>Team</th>'+Array.from({length:8},(_,i)=>'<th>W'+(i+1)+'</th>').join('')+'<th>TOTAL</th></tr></thead><tbody>';let body=r.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.n)+'</b></td>'+Array.from({length:8},(_,j)=>'<td>'+(Number.isFinite(x.weeks[j+1])?Math.round(x.weeks[j+1]*100)/100:'—')+'</td>').join('')+'<td>'+Math.round(x.total*100)/100+'</td></tr>').join('');"
          new="let head='<div class=\"scoreTableWrap\"><table class=\"scoreTable\"><thead><tr><th>Rank</th><th>Team</th><th class=\"mobileTeamScore\">Team Score</th>'+Array.from({length:8},(_,i)=>'<th>W'+(i+1)+'</th>').join('')+'<th>TOTAL</th></tr></thead><tbody>';let body=r.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.n)+'</b></td><td class=\"mobileTeamScore\">'+Math.round(x.total*100)/100+'</td>'+Array.from({length:8},(_,j)=>'<td>'+(Number.isFinite(x.weeks[j+1])?Math.round(x.weeks[j+1]*100)/100:'—')+'</td>').join('')+'<td>'+Math.round(x.total*100)/100+'</td></tr>').join('');"
          if old not in s:
              raise SystemExit('Expected scoreboard renderer not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          marker='/* Explicit mobile Team Score column */'
          css='''\n<style>\n'''+marker+'''\n.mobileTeamScore{display:none}\n@media(max-width:720px){\n  .scoreTable .mobileTeamScore{display:table-cell!important;position:sticky;left:228px;z-index:3;min-width:100px;text-align:center;font-weight:900}\n  .scoreTable thead .mobileTeamScore{background:#102c20;color:#f8f3e7;z-index:5}\n  .scoreTable tbody .mobileTeamScore{background:#eee7d7;color:var(--forest);border-left:2px solid #c6a45f}\n  .scoreTable tbody tr:nth-child(even) .mobileTeamScore{background:#e8e2d5}\n}\n</style>\n'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Add Team Score column beside Team on mobile scoreboard"
            git push origin HEAD:main
          fi
