name: Fix mobile Getting Started PDF viewer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full PDF and mobile-friendly viewing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='preview.innerHTML=\'<div class="gettingStartedPdfViewer" style="margin-top:14px;max-width:100%;overflow:hidden"><iframe src="\'+url+\'#view=FitH&zoom=page-width" title="Getting Started PDF" style="display:block;width:100%;max-width:100%;height:75vh;border:1px solid #b8b09c" allow="fullscreen"></iframe></div>\''
          new='preview.innerHTML=\'<div class="gettingStartedPdfViewer" style="margin-top:14px;width:100%;max-width:100%;overflow:hidden"><object data="\'+url+\'" type="application/pdf" title="Getting Started PDF" style="display:block;width:100%;max-width:100%;height:75vh;border:1px solid #b8b09c"><p>Your phone PDF viewer works best in a separate window. <a href="\'+url+\'" target="_blank" rel="noopener">Open the full Getting Started PDF</a></p></object></div>\''
          if old not in s:
              raise SystemExit('Expected current Getting Started PDF viewer not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Restore full Getting Started PDF on mobile"
            git push origin HEAD:main
          fi
