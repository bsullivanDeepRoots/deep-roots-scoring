name: Use new Deep Roots favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point browser icon to new Deep Roots favicon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">'
          new='<link rel="icon" type="image/png" href="deep-roots-favicon.png?v=20260926"><link rel="apple-touch-icon" href="deep-roots-favicon.png?v=20260926">'
          if old not in s:
              raise SystemExit('Expected favicon links not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Use new Deep Roots favicon"
            git push origin HEAD:main
          fi
