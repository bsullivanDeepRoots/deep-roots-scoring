name: Mobile scoreboard team score placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put total score beside team name on mobile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* Mobile scoreboard: team name with total score beside it */'
          if marker not in s:
              insert='''\n<style>\n'''+marker+'''\n@media(max-width:720px){\n  .scoreTable{min-width:760px}\n  .scoreTable th:nth-child(2),.scoreTable td:nth-child(2){min-width:230px;padding-right:58px}\n  .scoreTable td:nth-child(2){position:sticky}\n  .scoreTable td:nth-child(2)::after{content:attr(data-mobile-total);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--forest);font-size:16px}\n}\n</style>\n'''
              s=s.replace('</head>',insert+'</head>',1)
          # Add the row total as a data attribute on the team-name cell during board rendering.
          old="'<td><b>'+esc(t.name)+'</b></td>'"
          new="'<td data-mobile-total=\"'+(sum?sum.toFixed(2):'—')+'\"><b>'+esc(t.name)+'</b></td>'"
          if old in s:
              s=s.replace(old,new,1)
          elif 'data-mobile-total' not in s:
              raise SystemExit('Expected scoreboard team cell renderer not found; refusing unsafe edit')
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Show team total beside team name on mobile scoreboard"
            git push origin HEAD:main
          fi
