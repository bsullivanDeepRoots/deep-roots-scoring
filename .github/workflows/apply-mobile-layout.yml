name: Enable mobile scoreboard pan and scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow normal touch scrolling and panning on scoreboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # The previous pinch-zoom-only declaration blocked normal one-finger panning.
          s=s.replace('touch-action:pinch-zoom','touch-action:auto')
          marker='/* Mobile scoreboard natural pan and scroll */'
          css='''\n<style>\n'''+marker+'''\n@media(max-width:950px){\n  html,body{touch-action:auto;overflow-x:auto}\n  .scoreTableWrap{touch-action:auto;-webkit-overflow-scrolling:touch}\n}\n@media(max-width:720px) and (orientation:portrait){\n  .scoreTableWrap{overflow-x:auto;overflow-y:visible}\n}\n@media(max-width:950px) and (orientation:landscape){\n  .scoreTableWrap{overflow-x:auto;overflow-y:visible}\n}\n</style>\n'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Allow scoreboard scrolling panning and pinch zoom on mobile"
            git push origin HEAD:main
          fi
