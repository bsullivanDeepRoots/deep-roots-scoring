name: Expand desktop navigation banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand banner to fit navigation buttons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='width:min(100%,1000px);max-width:100%;justify-content:center}.tab,button'
          new='width:min(100%,1160px);max-width:100%;justify-content:center}.tab,button'
          if old not in s:
              raise SystemExit('Expected navigation banner width not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Expand navigation banner to fit buttons"
            git push origin HEAD:main
          fi
