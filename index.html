<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5b3a"><title>Deep Roots Scoring</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#1f5b3a;--g2:#dfece4;--bg:#f5f1e8;--ink:#26342c;--line:#cbd7cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 16px 60px}
header{border-bottom:4px solid var(--g);padding:14px 0 22px}h1{color:var(--g);font-size:clamp(32px,7vw,58px);margin:0;letter-spacing:.04em}header p{font-weight:700;margin:6px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab,button{min-height:44px;border:1px solid var(--g);border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;background:white;color:var(--g)}.tab.on,.primary{background:var(--g);color:white}
.grid{display:grid;grid-template-columns:.9fr 1.25fr;gap:18px}.card{background:#fffdf8;border:1px solid var(--line);border-top:5px solid var(--g);border-radius:13px;padding:18px;box-shadow:0 5px 18px #0000000c}h2{color:var(--g);margin-top:0}
label{display:block;font-weight:800;margin:13px 0 6px}select,input{width:100%;min-height:45px;padding:9px 11px;border:1px solid #aebdb4;border-radius:8px;font-size:16px;background:white}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preview{background:var(--g2);border-left:5px solid var(--g);padding:13px;margin:16px 0;border-radius:7px}.preview strong{font-size:28px;color:var(--g)}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.pills button{border-color:var(--line);padding:7px 10px}.pills button.on{background:var(--g);color:white;border-color:var(--g)}
.barrow{display:grid;grid-template-columns:minmax(110px,220px) 1fr 48px;gap:9px;align-items:center;margin:11px 0}.name{font-weight:800;overflow-wrap:anywhere}.track{height:28px;background:#e8ece9;border-radius:6px;overflow:hidden}.bar{height:100%;background:var(--g)}.val{font-weight:900;color:var(--g);text-align:right}.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:9px;color:#68736c}.status{font-weight:700;font-size:13px;margin-top:10px;min-height:18px}.hide{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}.scores{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<header><h1>DEEP ROOTS</h1><p>SACRED STRENGTH • TEAM SCORING</p></header>
<nav class="tabs"><button class="tab on" data-v="entry">Log Team Score</button><button class="tab" data-v="board">Scoreboard</button></nav>
<section id="entry" class="view"><div class="grid"><div class="card"><h2>Log Team Score</h2>
<label>Session</label><select id="session"></select><label>Team Name</label><select id="team"><option value="">Choose your team...</option></select>
<label>Week</label><select id="week"><option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option><option value="7">Week 7</option><option value="8">Week 8</option></select>
<label>Individual Scores</label><div class="scores"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 1"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 2"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 3"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 4"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 5"><input class="s" type="number" min="0" max="40" step=".1" inputmode="decimal" placeholder="Man 6"></div>
<div class="preview">Official Team Score: <strong id="preview">—</strong> / 120</div><button id="submit" class="primary">Submit Team Score</button><div id="status" class="status"></div>
</div><div class="card"><h2>Current Scoreboard</h2><div class="pills" id="p1"></div><div id="board1"></div></div></div></section>
<section id="board" class="view hide"><div class="card"><h2>Deep Roots Scoreboard</h2><div class="pills" id="p2"></div><div id="board2"></div></div></section>
</div><script>
const db=supabase.createClient("https://kbwgbdonltdwvxrjawkl.supabase.co","sb_publishable_CxCQrGRNfUWihqsPSZc55Q_QSACJJmX");
let S={sessions:[],teams:[],sid:null,w:1};const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
function scores(){let a=[];for(const x of $$(".s")){if(x.value==="")continue;let n=+x.value;if(!Number.isFinite(n)||n<0||n>40)return null;a.push(n)}if(!a.length)return null;return Math.round((a.reduce((x,y)=>x+y,0)/a.length*3)*100)/100}
function preview(){$("#preview").textContent=scores()??"—"}$$(".s").forEach(x=>x.oninput=preview);
async function sessions(){let {data,error}=await db.from("sessions").select("*");if(error)throw error;S.sessions=data||[];let a=S.sessions.find(x=>x.active)||S.sessions[0];S.sid=a?.id;$("#session").innerHTML=S.sessions.map(x=>'<option value="'+x.id+'">'+x.name+(x.subtitle?" — "+x.subtitle:"")+'</option>').join("");if(S.sid)$("#session").value=S.sid}
async function teams(){let {data,error}=await db.from("teams").select("*").eq("session_id",S.sid).order("name");if(error)throw error;S.teams=data||[];$("#team").innerHTML='<option value="">Choose your team...</option>'+S.teams.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join("")}
function pills(){let h=Array.from({length:8},(_,i)=>'<button data-w="'+(i+1)+'" class="'+(S.w===i+1?"on":"")+'">Week '+(i+1)+'</button>').join("");$("#p1").innerHTML=h;$("#p2").innerHTML=h}
async function render(){pills();let ids=S.teams.map(x=>x.id);if(!ids.length)return;let {data,error}=await db.from("weekly_scores").select("*").in("team_id",ids).eq("week_number",S.w);if(error)throw error;let m=Object.fromEntries((data||[]).map(x=>[x.team_id,+x.score]));let r=S.teams.map(x=>({n:x.name,s:m[x.id]})).filter(x=>Number.isFinite(x.s)).sort((a,b)=>b.s-a.s);let h=r.length?r.map((x,i)=>'<div class="barrow"><div class="name">'+(i+1)+'. '+x.n+'</div><div class="track"><div class="bar" style="width:'+Math.min(100,x.s/120*100)+'%"></div></div><div class="val">'+x.s+'</div></div>').join(""):'<div class="empty">No scores submitted for this week yet.</div>';$("#board1").innerHTML=h;$("#board2").innerHTML=h}
document.body.onclick=async e=>{let b=e.target.closest("[data-w]");if(b){S.w=+b.dataset.w;$("#week").value=S.w;await render()}}
$("#week").onchange=async e=>{S.w=+e.target.value;await render()};$("#session").onchange=async e=>{S.sid=e.target.value;await teams();await render()};
$("#submit").onclick=async()=>{let sc=scores(),tid=$("#team").value,w=+$("#week").value;if(!tid)return $("#status").textContent="Choose your team first.";if(sc===null)return $("#status").textContent="Enter 1–6 scores between 0 and 40.";$("#submit").disabled=true;let {error}=await db.from("weekly_scores").upsert({team_id:tid,week_number:w,score:sc,updated_at:new Date().toISOString()},{onConflict:"team_id,week_number"});$("#submit").disabled=false;if(error)return $("#status").textContent="Could not submit: "+error.message;$("#status").textContent="Score submitted: "+sc+" / 120";$$(".s").forEach(x=>x.value="");preview();S.w=w;await render()};
$$(".tab").forEach(b=>b.onclick=async()=>{$$(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");$$(".view").forEach(x=>x.classList.add("hide"));$("#"+b.dataset.v).classList.remove("hide");if(b.dataset.v==="board")await render()});
(async()=>{try{await sessions();await teams();await render()}catch(e){$("#board1").innerHTML='<div class="empty">Database connection error: '+e.message+'</div>'}})();
</script></body></html>
